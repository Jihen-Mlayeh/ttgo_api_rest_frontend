name: ttgo_iot_app
description: Application IoT pour TTGO T-Display avec ESP32
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  # State management
  provider: ^6.1.1

  csv: ^6.0.0

  # API calls
  http: ^1.2.0
  dio: ^5.4.0

  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0

  # Charts
  fl_chart: ^0.66.0

  # Animations
  lottie: ^3.0.0
  shimmer: ^3.0.0

  # UI
  google_fonts: ^6.1.0

  # Storage
  shared_preferences: ^2.2.2

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/